<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<title>佐渡住宅GAS</title>
<script>try{var p=JSON.parse(localStorage.getItem("sado-prefs")||"{}"),th=p.theme||"auto";if(th==="dark"||(th==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css?v=105">
</head>
<body>
<div id="boot"><div class="bootbox"><div class="bootmsg">読み込み中...</div><div id="bootLogo" class="spin"></div></div></div>
<div id="mapLoading" class="hidden"><div class="loadbox"><div id="mapLoadLogo" class="spin"></div><div class="note">読み込み中...</div></div></div>
<div id="helpWin" class="hidden"><div class="mhead"><div class="t">ヘルプ</div><button data-act="helpClose" aria-label="閉じる">✕</button></div><div class="mbody" id="helpWinBody"></div></div>
<script>try{var L=JSON.parse(localStorage.getItem("sado-logo")||"{}");if(L.m==="custom"&&L.i){var e=document.getElementById("bootLogo");e.className="bootimg";e.style.backgroundImage="url("+L.i+")";}}catch(x){}</script>

<div id="loginScreen" class="screen hidden">
  <div class="login-box">
    <h1 id="loginTitle">佐渡住宅GAS</h1>
    <div class="note" id="loginNote"></div>
    <div id="memberPanel">
      <label for="loginId">ID</label><input id="loginId" autocapitalize="none" autocomplete="username">
      <label for="loginPw">パスワード</label><input id="loginPw" type="password" autocomplete="current-password">
      <button class="btn primary block" data-act="login">ログイン</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <button id="hamBtn" data-act="menuHome" aria-label="メニュー">☰</button>
  <button class="fab" id="searchFab" data-act="searchToggle" aria-label="区域を検索" title="区域を検索"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
  <div id="hdr"><div class="t" id="hdrTitle"></div><input id="hdrQ" type="search" placeholder="区域を検索" autocomplete="off" aria-label="区域を検索"><span id="syncBadge" data-act="syncNow" role="button">同期済み</span></div>
  <div id="map"></div>
  <div id="hdrRes" class="hidden"></div>
  <button class="fab" id="layerBtn" data-act="layerToggle" aria-label="マップの種類" title="マップの種類"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <div id="legend"></div><div id="frameSw"></div>
  <button class="fab compass-btn is-locate" id="locBtn" data-act="locate" title="現在地へ移動" aria-label="現在地へ移動"><svg class="ico-locate" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><svg class="ico-compass" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.8"/><g class="compass-needle"><path d="M16 4 L21 16 L11 16 Z" fill="#dc2626"/><path d="M16 28 L21 16 L11 16 Z" fill="currentColor" fill-opacity="0.55"/><circle cx="16" cy="16" r="1.6" fill="#ffffff"/></g></svg></button>
  <button class="hidden" id="areaClearBtn" data-act="clearArea" title="区域の選択を解除" aria-label="区域の選択を解除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <div id="editFrame" class="hidden"><span>編集モード</span></div>
  <div id="editBar" class="hidden"><div class="row edmain" id="edRow1"><button class="btn small" data-act="ed:addP" id="edParBtn">＋親区域</button><button class="btn small" data-act="ed:addK" id="edKidBtn">＋子区域</button><button class="btn small" data-act="ed:addAA" id="edAptAreaBtn">＋アパート区域</button></div><div class="row edmain hidden" id="edRow2"><button class="btn small primary" data-act="ed:addH" id="edHouseBtn">＋一軒家</button><button class="btn small primary" data-act="ed:addB" id="edAddBtn">＋集合住宅</button><button class="btn small" data-act="ed:bound" id="edBoundBtn">境界変更</button><button class="btn small" data-act="ed:multi" id="edMultiBtn">複数選択</button></div><div class="row hidden" id="edToolRow"><span id="edToolInfo" class="note"></span><button class="btn small primary" data-act="ed:toolOk" id="edToolOk">確定</button></div><div class="row hidden" id="edMultiRow"><span id="edMultiInfo" class="note"></span><button class="btn small" data-act="ed:box" id="edBoxBtn">四角で選ぶ</button><button class="btn small" data-act="ed:selAll" id="edSelAllBtn">全選択</button><button class="btn small" data-act="ed:selNone" id="edSelNoneBtn">解除</button><button class="btn small danger" data-act="ed:delSel" id="edDelSelBtn">削除</button><button class="btn small" data-act="ed:restore" id="edRestoreBtn">削除済みを戻す</button></div><div class="row edend"><button class="btn small" data-act="ed:undo" id="edUndoBtn">↶ 戻す</button><button class="btn small" data-act="ed:toggle" id="edQuitBtn">保存せず終了</button><button class="btn small danger" data-act="ed:saveQuit" id="edSaveBtn">保存して終了</button></div><div id="editHint" class="hidden"></div></div>
    <div id="sheet" class="hidden"></div>
</div>

<div id="home" class="screen hidden"></div>
<div id="menu" class="screen hidden"></div>
<div id="admin" class="screen hidden"></div>
<div id="panelBack"></div>
<div id="nav" class="hidden">
  <button data-act="nav" data-v="map" class="on"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg></span>地図</button>
  <button data-act="nav" data-v="areas"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></span>区域</button>
  <button data-act="nav" data-v="report"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg></span>報告</button>
  <button data-act="nav" data-v="settings"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></span>設定</button>
  <button data-act="nav" data-v="editmenu" id="navEdit" class="hidden"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>編集</button>
  <button data-act="nav" data-v="admin" id="navAdmin" class="hidden"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg></span>管理</button>
</div>
<div id="loading" class="hidden"><div class="loadbox"><div id="loadLogo" class="spin"></div><div class="note">読み込み中...</div></div></div>
<div id="toast" class="hidden"></div>

<script defer src="config.js"></script>
<script defer src="lib/leaflet.js"></script>
<script defer src="lib/leaflet-rotate.js"></script>
<script defer src="app.js?v=105"></script>
<script defer src="maprot.js?v=105"></script>
<script defer src="admin.js?v=105"></script>
<script defer src="edit.js?v=105"></script>
</body>
</html>
